{% extends "base.html" %}

{% block title %}Recipes — Meal Planner{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Recipes</h1>
    <a class="btn" href="/recipes/new">New Recipe</a>
</div>

<div class="search-row">
    <input type="search" id="recipe-search" class="search-input" placeholder="Search recipes…" autocomplete="off">
    <span id="tag-filter-label" class="tag-filter-label hidden"></span>
</div>

<div id="recipe-grid" class="card-grid"></div>
<p id="empty-state" class="empty-state hidden">No recipes found.</p>

<script>
(function () {
    var activeTag = null;
    var searchTimeout = null;

    var EMOJI_RULES = [
        [['pasta', 'italian', 'spaghetti', 'carbonara', 'lasagna', 'linguine', 'fettuccine', 'penne', 'risotto'], '🍝'],
        [['taco', 'tacos', 'burrito', 'burritos', 'mexican', 'quesadilla', 'enchilada', 'fajita'], '🌮'],
        [['pizza', 'pizzas'], '🍕'],
        [['curry', 'thai', 'indian', 'asian', 'chinese', 'japanese', 'korean', 'ramen', 'noodles'], '🍜'],
        [['soup', 'stew', 'chili', 'chilli', 'broth'], '🍲'],
        [['burger', 'burgers', 'beef', 'steak'], '🍔'],
        [['fish', 'salmon', 'seafood', 'shrimp', 'tuna', 'cod', 'halibut', 'tilapia', 'trout'], '🐟'],
        [['chicken', 'turkey', 'poultry'], '🍗'],
        [['cookie', 'cookies'], '🍪'],
        [['muffin', 'muffins', 'cupcake', 'cupcakes'], '🧁'],
        [['cake', 'cakes', 'cheesecake', 'brownie', 'brownies', 'chocolate', 'sweet', 'dessert'], '🍰'],
        [['pie', 'pies', 'tart', 'tarts', 'pastry'], '🥧'],
        [['bread', 'baking', 'roll', 'rolls', 'scone', 'scones', 'biscuit', 'loaf'], '🍞'],
        [['breakfast', 'egg', 'eggs', 'pancake', 'waffle', 'omelette', 'omelet', 'frittata'], '🍳'],
        [['sandwich', 'wrap', 'wraps', 'panini'], '🥪'],
        [['salad', 'salads'], '🥗'],
        [['vegan', 'vegetarian'], '🌱'],
        [['rice', 'grain', 'grains'], '🍚'],
    ];

    function recipeEmoji(r) {
        var haystack = (r.tags || []).concat(r.title.toLowerCase().split(/\W+/));
        for (var i = 0; i < EMOJI_RULES.length; i++) {
            var keywords = EMOJI_RULES[i][0], emoji = EMOJI_RULES[i][1];
            for (var j = 0; j < keywords.length; j++) {
                if (haystack.indexOf(keywords[j]) !== -1) return emoji;
            }
        }
        return '🍽️';
    }

    function bannerClass(id) {
        return 'banner-' + (id % 8);
    }

    function esc(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderCards(recipes) {
        var grid = document.getElementById('recipe-grid');
        var empty = document.getElementById('empty-state');
        if (!recipes.length) {
            grid.innerHTML = '';
            empty.classList.remove('hidden');
            return;
        }
        empty.classList.add('hidden');
        grid.innerHTML = recipes.map(function (r) {
            var meta = '';
            if (r.cook_time_minutes) meta += '<li>Cook time: ' + esc(r.cook_time_minutes) + ' min</li>';
            if (r.servings) meta += '<li>Servings: ' + esc(r.servings) + '</li>';
            var tagHtml = '';
            if (r.tags && r.tags.length) {
                tagHtml = '<div class="tag-list">' +
                    r.tags.map(function (t) {
                        var active = t === activeTag ? ' active' : '';
                        return '<button class="tag-badge' + active + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>';
                    }).join('') +
                    '</div>';
            }
            return '<div class="card">' +
                (r.image_url
                    ? '<img class="card-img" src="' + esc(r.image_url) + '" alt="' + esc(r.title) + '">'
                    : '<div class="card-banner ' + bannerClass(r.id) + '">' + recipeEmoji(r) + '</div>') +
                '<div class="card-body">' +
                '<h2 class="card-title">' + esc(r.title) + '</h2>' +
                '<ul class="card-meta">' + meta + '</ul>' +
                tagHtml +
                '</div>' +
                '<div class="card-footer">' +
                '<a class="btn" href="/recipes/' + r.id + '">View Recipe</a>' +
                '</div>' +
                '</div>';
        }).join('');

        grid.querySelectorAll('.tag-badge').forEach(function (btn) {
            btn.addEventListener('click', function () {
                filterByTag(btn.dataset.tag);
            });
        });
    }

    function updateTagLabel() {
        var label = document.getElementById('tag-filter-label');
        if (activeTag) {
            label.textContent = activeTag + ' ×';
            label.classList.remove('hidden');
        } else {
            label.classList.add('hidden');
        }
    }

    function filterByTag(tag) {
        activeTag = activeTag === tag ? null : tag;
        fetchRecipes();
    }

    function fetchRecipes() {
        var params = new URLSearchParams();
        var search = document.getElementById('recipe-search').value.trim();
        if (search) params.set('search', search);
        if (activeTag) params.set('tag', activeTag);
        fetch('/api/recipes?' + params)
            .then(function (res) { return res.json(); })
            .then(function (recipes) {
                renderCards(recipes);
                updateTagLabel();
            });
    }

    document.getElementById('recipe-search').addEventListener('input', function () {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(fetchRecipes, 250);
    });

    document.getElementById('tag-filter-label').addEventListener('click', function () {
        activeTag = null;
        fetchRecipes();
    });

    fetchRecipes();
}());
</script>
{% endblock %}
